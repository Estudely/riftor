name: demo

# Render demo.gif from demo.tape with VHS and commit it back.
# Runs on demand, or automatically when the tape/workflow changes.

on:
  workflow_dispatch:
  push:
    # Only on branch pushes to main — NOT on tags. A tag checkout is a detached
    # HEAD, so the "commit demo.gif back" step has no branch to push to.
    branches: [main]
    paths:
      - "demo.tape"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

env:
  ANTHROPIC_API_KEY: sk-demo  # dummy; the tape only uses offline commands

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install riftor (on PATH for VHS)
        run: |
          uv venv /opt/rv
          uv pip install --python /opt/rv .
          echo "/opt/rv/bin" >> "$GITHUB_PATH"
      - name: Install VHS toolchain (ffmpeg + ttyd + vhs)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 \
            -o /tmp/ttyd.x86_64
          echo "8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55  /tmp/ttyd.x86_64" \
            | sha256sum --check --status
          sudo install /tmp/ttyd.x86_64 /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@v0.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Render demo.gif
        run: |
          riftor --version
          ttyd --version
          vhs --version
          vhs demo.tape
      - name: Upload rendered demo
        uses: actions/upload-artifact@v4
        with:
          name: rendered-demo
          path: demo.gif
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: gif
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download rendered demo
        uses: actions/download-artifact@v4
        with:
          name: rendered-demo
          path: .
      - name: Commit demo.gif if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain demo.gif)" ]; then
            echo "demo.gif unchanged"
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo.gif
          git commit -m "chore: regenerate demo.gif [skip ci]"
          git push origin "HEAD:${BRANCH}"
